services:
  relating-server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - RELATING_PORT=8080
      - RELATING_HOST=0.0.0.0
      - RELATING_DATA_DIR=/app/data
      - RELATING_DATABASE_URL=sqlite:///app/data/relating_metadata.db
      - RELATING_LOG_LEVEL=info
    volumes:
      - relating-data:/app/data
    restart: unless-stopped

volumes:
  relating-data:
