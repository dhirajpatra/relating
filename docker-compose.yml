# Relating — full stack.
#
#   docker compose up --build                         # server alone (SQLite; enough to migrate)
#   docker compose --profile postgres up --build      # ... plus team Postgres (+ db-init job)
#   docker compose --profile ollama up --build        # ... plus local Ollama models
#   docker compose --profile neo4j up                 # ... plus a local Neo4j for migration testing
#   docker compose --profile postgres --profile ollama --profile neo4j up   # everything
#
# Workbench:  http://127.0.0.1:${RELATING_PORT:-8080}
# API health:  http://127.0.0.1:${RELATING_PORT:-8080}/api/v1/health
# Ollama API:  http://127.0.0.1:${OLLAMA_PORT:-11434}   (in-compose: http://ollama:11434)
# Neo4j:       bolt://127.0.0.1:${NEO4J_BOLT_PORT:-7687} + http://127.0.0.1:${NEO4J_HTTP_PORT:-7474}
#
# Every service builds from its own folder under docker/ (one folder +
# Dockerfile each). Tunables live in .env (see .env.example); all of them
# have working defaults here so a bare `docker compose up` just works.
# All published ports bind to 127.0.0.1 only: nothing listens on the LAN.
# See docs/docker.md for the full runbook.

services:
  server:
    build:
      context: .
      dockerfile: docker/server/Dockerfile
    image: relating-server:latest
    container_name: relating-server
    ports:
      - "127.0.0.1:${RELATING_PORT:-8080}:8080"
    env_file:
      - path: .env
        required: false
    environment:
      # Container-correct values win over .env (which describes a laptop).
      RELATING_PORT: 8080
      RELATING_HOST: 0.0.0.0
      RELATING_DATA_DIR: /app/data
      # SQLite stays the runtime metadata store; Postgres is provisioned by
      # the db-init job for team workflows (see docs/postgres.md).
      RELATING_DATABASE_URL: sqlite:///app/data/relating_metadata.db
      RELATING_LOG_LEVEL: ${RELATING_LOG_LEVEL:-info}
      RELATING_MCP_TOKEN: ${RELATING_MCP_TOKEN:-}
      # Optional API bearer token: when set, every /api/v1 route except
      # /health requires `Authorization: Bearer <token>`. Recommended on
      # any shared host.
      RELATING_API_TOKEN: ${RELATING_API_TOKEN:-}
      # Pinned: containers have no OS keychain, so `keyring` from a laptop
      # .env would break secret resolution here. `auto` reads $AURA_PASSWORD
      # (above) and *_FILE sidecars instead.
      RELATING_SECRET_BACKEND: auto
      AURA_PASSWORD: ${AURA_PASSWORD:-}
      # Prefer a mounted secret file on staging (keeps the password out of
      # `docker inspect`): create `.secrets/aura_password`, uncomment the
      # `secrets:` block on this service plus the top-level `secrets:`
      # below, and set AURA_PASSWORD_FILE=/run/secrets/aura_password.
      AURA_PASSWORD_FILE: ${AURA_PASSWORD_FILE:-}
      # Container-correct Ollama address (localhost here would be this
      # container, not the ollama service). Only resolves when the ollama
      # profile is up; otherwise Meta chat fallback/embeddings report a
      # clear connection error. Used for Meta chat fallback and for
      # embeddings, which the Meta API does not provide.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434/v1}
    # secrets:
    #   - aura_password
    volumes:
      - relating-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - relating-net
    restart: unless-stopped

  # One-shot provisioning job (same image as server): runs the sanctioned
  # `relating db init-postgres` + `db check-postgres` against the postgres
  # service. Idempotent — safe on every `docker compose up`. Opt-in via the
  # postgres profile; the entrypoint percent-encodes the password when it
  # builds the connection URL, so any characters are safe in POSTGRES_PASSWORD.
  db-init:
    build:
      context: .
      dockerfile: docker/server/Dockerfile
    image: relating-server:latest
    container_name: relating-db-init
    profiles: ["postgres"]
    command: ["db-init"]
    env_file:
      - path: .env
        required: false
    environment:
      PGHOST: postgres
      PGPORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-relating}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-relating}
      POSTGRES_DB: ${POSTGRES_DB:-relating}
      # Explicit URL override (already-encoded): when set, the entrypoint
      # uses it verbatim instead of building one from the parts above.
      RELATING_POSTGRES_URL: ${RELATING_POSTGRES_URL:-}
      DB_INIT_ATTEMPTS: ${DB_INIT_ATTEMPTS:-30}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - relating-net
    restart: "no"

  postgres:
    build:
      context: docker/postgres
      dockerfile: Dockerfile
    image: relating-postgres:latest
    container_name: relating-postgres
    profiles: ["postgres"]
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-relating}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-relating}
      POSTGRES_DB: ${POSTGRES_DB:-relating}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-relating} -d $${POSTGRES_DB:-relating}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - relating-net
    restart: unless-stopped

  ollama:
    build:
      context: docker/ollama
      dockerfile: Dockerfile
    image: relating-ollama:latest
    container_name: relating-ollama
    profiles: ["ollama"]
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    env_file:
      - path: .env
        required: false
    environment:
      # NB: `-` (not `:-`) so that an explicitly empty value skips pulling.
      OLLAMA_PRELOAD_MODELS: ${OLLAMA_PRELOAD_MODELS-llama3.1 nomic-embed-text}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    networks:
      - relating-net
    restart: unless-stopped
    # Uncomment for NVIDIA GPU acceleration (requires the NVIDIA container
    # toolkit on the host). CPU-only works out of the box.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # Optional local Bolt target for testing the Aura migration workflow
  # without a cloud Aura account. Off by default:
  #   docker compose --profile neo4j up
  neo4j:
    build:
      context: docker/neo4j
      dockerfile: Dockerfile
    image: relating-neo4j:latest
    container_name: relating-neo4j
    profiles: ["neo4j"]
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687"
    # NB: deliberately NO env_file here. The Neo4j entrypoint parses every
    # NEO4J_* variable as a server setting, so importing .env wholesale
    # (NEO4J_DATABASE, NEO4J_PASSWORD, NEO4J_*_PORT, ...) breaks startup with
    # "Unrecognized setting" under strict validation. The ${} values below
    # still resolve from your .env on the host — only the raw keys stay out.
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-relating-neo4j}
      # NB: every NEO4J_* var is parsed as a Neo4j config setting, so the
      # healthcheck password lives under a non-NEO4J_ name. No other NEO4J_*
      # settings: the stock defaults (incl. the `neo4j` database) are what
      # migration testing needs, and unknown settings fail strict validation.
      RELATING_NEO4J_PASSWORD: ${NEO4J_PASSWORD:-relating-neo4j}
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${RELATING_NEO4J_PASSWORD:-relating-neo4j}\" 'RETURN 1 AS ok'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s
    networks:
      - relating-net
    restart: unless-stopped

networks:
  relating-net:
    driver: bridge

# Staging secret mount (see the `secrets:` hint on the server service):
#   mkdir -p .secrets && chmod 700 .secrets
#   printf '%s' "$AURA_PASSWORD" > .secrets/aura_password
# then uncomment the blocks and set AURA_PASSWORD_FILE=/run/secrets/aura_password.
# secrets:
#   aura_password:
#     file: ./.secrets/aura_password

volumes:
  relating-data:
  pgdata:
  ollama-data:
  neo4j-data:
  neo4j-logs:
