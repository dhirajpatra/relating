[workspace]
resolver = "2"
members = [
    "crates/relating-core",
    "crates/relating-metadata",
    "crates/relating-graph",
    "crates/relating-ai",
    "crates/relating-ingest",
    "crates/relating-retrieval",
    "crates/relating-migrate",
    "crates/relating-mcp",
    "crates/relating-schema",
    "crates/relating-portability",
    "crates/relating-cli",
    "crates/relating-shadow",
    "crates/relating-debug",
    "crates/relating-synth",
    "crates/relating-advisor",
    "crates/relating-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Relating Contributors"]
license = "Apache-2.0"

[workspace.dependencies]
tokio = { version = "1.41", features = ["full"] }
axum = { version = "0.7", features = ["macros"] }
# NB: no workspace `tower` entry: its only consumers (server, mcp tests)
# declare `tower` directly with the `util` feature, and an unused workspace
# entry trips newer cargo's unused-dependency manifest warning.
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "chrono", "uuid"] }
relate = "1.0.1"
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tempfile = "3.14"
csv = "1.3"
sha2 = "0.10"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "ring", "tls12"] }
webpki-roots = "1.0"
regex = "1.13"
rand = "0.9"
# NB: keyring 3.x ships with NO default features; without explicit backends it
# silently builds the in-memory mock store (writes succeed and vanish on
# exit). Always enable the real per-OS backends (non-matching platforms are
# no-ops via target-gated deps in keyring's manifest).
keyring = { version = "3.6", features = ["apple-native", "windows-native", "sync-secret-service"] }
sqlparser = "0.64"
dotenvy = "0.15"
base64 = "0.22"
pdf-extract = "0.12"
zip = "2.2"
quick-xml = "0.38"

# Internal crates
relating-core = { path = "crates/relating-core" }
relating-metadata = { path = "crates/relating-metadata" }
relating-graph = { path = "crates/relating-graph" }
relating-ai = { path = "crates/relating-ai" }
relating-ingest = { path = "crates/relating-ingest" }
relating-retrieval = { path = "crates/relating-retrieval" }
relating-migrate = { path = "crates/relating-migrate" }
relating-mcp = { path = "crates/relating-mcp" }
relating-schema = { path = "crates/relating-schema" }
relating-portability = { path = "crates/relating-portability" }
relating-cli = { path = "crates/relating-cli" }
relating-shadow = { path = "crates/relating-shadow" }
relating-debug = { path = "crates/relating-debug" }
relating-synth = { path = "crates/relating-synth" }
relating-advisor = { path = "crates/relating-advisor" }
