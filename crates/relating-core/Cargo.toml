[package]
name = "relating-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
sha2 = { workspace = true }
dotenvy = { workspace = true }
thiserror = { workspace = true }
keyring = { workspace = true, optional = true }

[features]
default = []
# Real OS backends come from the workspace keyring features (see root
# Cargo.toml): without them keyring silently falls back to its mock store.
os-keychain = ["keyring"]
